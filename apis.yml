aid: capsovision
name: CapsoVision
description: 'CapsoVision, Inc. (Nasdaq: CV) is a commercial-stage medical technology
  company headquartered in Saratoga, California that develops advanced imaging and
  artificial-intelligence technologies for gastrointestinal disease detection and screening.
  Its CapsoCam Plus single-use capsule endoscope captures a 360-degree panoramic view
  of the small-bowel mucosa without external receiver equipment, and is paired with
  CapsoCloud, an account-gated cloud application, and CapsoView review software for
  physician image review and reporting. A next-generation CapsoCam Colon system is in
  development. CapsoVision publishes no public developer program, API reference, or
  machine-readable specification; CapsoCloud is an end-user clinical web and mobile
  application whose JSON backend is private to the product.'
