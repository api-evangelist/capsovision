  detail: CapsoVision ships clinical software (CapsoCloud/CapsoView) but no developer
    program of any kind - the api., developer., docs. and portal. subdomains do not
    resolve at all, its GitHub org returns an empty repository array, and the CapsoCloud
    app's own JSON backend at www.capsocloud.com/api/ answers "Resource Not Found" to
    every unauthenticated path while every other path (including every /.well-known/*)
    returns the same 13,322-byte AngularJS shell, so a 200 from that host is a soft-404
    and there is no public API, spec, or reference to read.
